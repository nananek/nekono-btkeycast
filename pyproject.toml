[project]
name = "btkeycast"
version = "0.2.1"
description = "Forward the local keyboard to an iPad (or any BLE central) as a HID-over-GATT keyboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Nekono Nana KAKKO KARI", email = "3267314+nananek@users.noreply.github.com" }]
dependencies = []

[project.scripts]
btkeycast = "btkeycast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btkeycast"]
